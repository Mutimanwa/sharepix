# ── SharePix · Livraison continue « preview » ────────────────────────────
# À chaque push sur `main` : publication avec EAS Update sur `preview`.
# La réception OTA n'est pas activée tant qu'expo-updates et son URL/runtime
# ne sont pas configurés dans l'application; les builds installables sont
# générés manuellement (APK Android ou IPA iOS).
# En manuel (workflow_dispatch) : choix entre un APK Android et un IPA iOS.
# ─────────────────────────────────────────────────────────────────────────
name: Preview (EAS Update)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build:
        description: 'Builder aussi une application de preview installable ?'
        type: boolean
        required: false
        default: false
      platform:
        description: 'Plateforme à builder si build=true'
        type: choice
        required: true
        default: android
        options:
          - android
          - ios

concurrency:
  group: preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish OTA update
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update (branch preview)
        run: eas update --branch preview --auto --non-interactive

  build:
    name: Build preview app
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview app
        run: eas build --platform "${{ github.event.inputs.platform || 'android' }}" --profile preview --non-interactive
