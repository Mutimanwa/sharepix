# ── SharePix · Publication APK & Release GitHub ─────────────────────────
name: Release APK (GitHub Release)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build APK & Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK and Download
        run: |
          eas build --platform android --profile preview --non-interactive --json > build-result.json
          BUILD_URL=$(jq -r '.[0].artifacts.buildUrl // .artifacts.buildUrl' build-result.json)
          curl -L "$BUILD_URL" -o sharepix-latest.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "SharePix v1.0.${{ github.run_number }}"
          body: |
            🚀 **Nouvelle mise à jour disponible !**

            Téléchargez le fichier `sharepix-latest.apk` ci-dessous pour installer la dernière version sur votre appareil Android.
          draft: false
          prerelease: false
          files: sharepix-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
