# ── SharePix · Intégration continue ──────────────────────────────────────
# Déclenché sur chaque PR et chaque push sur `main`.
# Valide : types TypeScript, santé du projet Expo (expo-doctor),
# la Edge Function Deno (check + lint) et la sécurité RLS/Storage en live.
# ─────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript + Expo Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # expo-doctor dépend de deux services externes.
      #
      # 1. API Expo (schéma de config, versions du SDK) : une panne se
      #    traduit par « fetch failed ». WARN_ON_NETWORK_ERRORS ne rend la
      #    main en succès que si TOUTES les erreurs sont réseau — un vrai
      #    problème reste donc bloquant.
      # 2. React Native Directory : le contrôle échoue par « unexpected
      #    server response » (non classé comme erreur réseau) quand le
      #    service répond mal. Il vérifie qu'un paquet est bien référencé
      #    dans un annuaire tiers, ce qui n'a pas à bloquer une PR.
      #    Les contrôles de version du SDK, eux, restent actifs.
      - name: Expo Doctor
        env:
          EXPO_DOCTOR_WARN_ON_NETWORK_ERRORS: '1'
          EXPO_DOCTOR_ENABLE_DIRECTORY_CHECK: '0'
        run: npx expo-doctor

  edge-function:
    name: Edge Function (Deno)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno check
        run: deno check --config supabase/functions/deno.json supabase/functions/activity-push/index.ts

      - name: Deno lint
        run: deno lint --config supabase/functions/deno.json supabase/functions/activity-push/index.ts

  security:
    name: RLS & Storage (projet de test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── P1-16 : ne JAMAIS écrire dans la production ──
      # Ce test crée deux comptes anonymes, un album et un fichier, puis
      # tente de les supprimer. Exécuté contre la prod à chaque pull
      # request, il y laissait des comptes et des lignes dès que le
      # nettoyage échouait (il est en try/catch best-effort).
      # Il vise désormais un projet Supabase de test dédié.
      - name: Configuration de test disponible ?
        id: staging
        env:
          STAGING_URL: ${{ secrets.STAGING_SUPABASE_URL }}
        run: |
          if [ -n "$STAGING_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=RLS non vérifié::STAGING_SUPABASE_URL absent. Le test RLS/Storage n'est PAS exécuté. Il écrit des données : il ne doit pas viser la production. Provisionne un projet de test, applique supabase/migrations/, puis renseigne STAGING_SUPABASE_URL et STAGING_SUPABASE_ANON_KEY."
          fi

      - name: RLS / Storage check
        if: steps.staging.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: node supabase/rls-check.cjs
