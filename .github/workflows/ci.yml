# ── SharePix · Intégration continue ──────────────────────────────────────
# Déclenché sur chaque PR et chaque push sur `main`.
# Valide : types TypeScript, santé du projet Expo (expo-doctor),
# la Edge Function Deno (check + lint) et la sécurité RLS/Storage en live.
# ─────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Qualité (types, lint, tests) + Expo Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Tests unitaires (Jest)
        run: npm test -- --ci

      # expo-doctor dépend de deux services externes.
      #
      # 1. API Expo (schéma de config, versions du SDK) : une panne se
      #    traduit par « fetch failed ». WARN_ON_NETWORK_ERRORS ne rend la
      #    main en succès que si TOUTES les erreurs sont réseau — un vrai
      #    problème reste donc bloquant.
      - name: Expo Doctor
        env:
          EXPO_DOCTOR_WARN_ON_NETWORK_ERRORS: '1'
        run: |
          set +e
          OUT=$(npx expo-doctor 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            # Les journaux complets ne sont pas toujours accessibles :
            # on republie la cause en annotation, lisible via l'API.
            MSG=$(echo "$OUT" | sed -n '1,40p' | tr '\n' ' ' | tr -d '%' | cut -c1-900)
            echo "::error title=expo-doctor::${MSG}"
          fi
          exit $CODE

  edge-function:
    name: Edge Function (Deno)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno check
        run: deno check --config supabase/functions/deno.json supabase/functions/activity-push/index.ts

      - name: Deno lint
        run: deno lint --config supabase/functions/deno.json supabase/functions/activity-push/index.ts

  security:
    name: RLS & Storage (projet de test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── P1-16 : ne JAMAIS écrire dans la production ──
      # Ce test crée deux comptes anonymes, un album et un fichier, puis
      # tente de les supprimer. Exécuté contre la prod à chaque pull
      # request, il y laissait des comptes et des lignes dès que le
      # nettoyage échouait (il est en try/catch best-effort).
      # Il vise désormais un projet Supabase de test dédié.
      - name: Vérifier les identifiants du projet de test
        id: staging
        env:
          STAGING_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          set -eu
          if [ -z "$STAGING_URL" ] || [ -z "$STAGING_ANON_KEY" ]; then
            echo "::error title=Configuration RLS absente::Renseigne STAGING_SUPABASE_URL et STAGING_SUPABASE_ANON_KEY pour le projet de test dédié. Aucun secret n'est affiché."
            exit 1
          fi
          HOST=$(node -e 'try { process.stdout.write(new URL(process.env.STAGING_URL).hostname) } catch { process.exit(1) }') || {
            echo "::error title=URL de staging invalide::STAGING_SUPABASE_URL doit être une URL valide. Sa valeur n'est pas affichée."
            exit 1
          }
          if [ "$HOST" != "slxljxllyjitnjnqaapk.supabase.co" ]; then
            echo "::error title=Cible RLS inattendue::Le contrôle ne s'exécutera que sur le projet de test sharepix-staging (slxljxllyjitnjnqaapk), jamais sur la production. URL masquée."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Codes de sortie du script : 0 = vérifications achevées sans fuite,
      # 1 = fuite réelle, 2 = une vérification est impossible ou non concluante.
      # Une erreur de configuration ne doit jamais devenir un succès RLS.
      - name: RLS / Storage check
        if: steps.staging.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          set +e
          node supabase/rls-check.cjs
          CODE=$?
          if [ $CODE -eq 1 ]; then
            echo "::error title=Fuite RLS::Au moins une table ou un fichier est accessible sans en avoir le droit. Vérifie les policies de supabase/migrations/."
          elif [ $CODE -eq 2 ]; then
            echo "::error title=Vérification RLS impossible::Le diagnostic détaillé ci-dessus indique une erreur réseau, de configuration ou Auth. Vérifier les identifiants du staging et les connexions anonymes; les contrôles non atteints restent NON VÉRIFIÉS."
          fi
          exit $CODE
